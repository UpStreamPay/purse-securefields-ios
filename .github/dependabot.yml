version: 2

# One pull request a week per ecosystem, as in the other three SDKs: every update of an ecosystem
# lands in that ecosystem's group, so a single review (and a single run of the required checks)
# covers them. Security updates get their own group, opened as soon as an advisory lands.
updates:
  # The SDK itself has no third-party source dependencies (Package.swift declares none),
  # so GitHub Actions is the only dependency surface worth watching.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
