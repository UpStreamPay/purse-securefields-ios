name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library-tests:
    name: Library Tests
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pick iOS Simulator
        run: |
          SIM_ID=$(xcrun simctl list -j devices available | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          for rt, devs in sorted(d.items(), reverse=True):
              if 'iOS' not in rt: continue
              for dev in devs:
                  if 'iPhone' in dev['name']:
                      print(dev['udid'])
                      raise SystemExit
          ")
          echo "SIM_ID=$SIM_ID" >> $GITHUB_ENV
          xcrun simctl boot "$SIM_ID" || true

      - name: Run
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme PurseSecureFields \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            | grep --line-buffered -E "(Test Suite|Test Case|✔|✘|error:|FAILED|PASSED|run with)"

  demo-ui-tests:
    name: Demo UI Tests
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pick iOS Simulator
        run: |
          SIM_ID=$(xcrun simctl list -j devices available | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          for rt, devs in sorted(d.items(), reverse=True):
              if 'iOS' not in rt: continue
              for dev in devs:
                  if 'iPhone' in dev['name']:
                      print(dev['udid'])
                      raise SystemExit
          ")
          echo "SIM_ID=$SIM_ID" >> $GITHUB_ENV
          xcrun simctl boot "$SIM_ID" || true

      - name: Run
        run: |
          set -o pipefail
          xcodebuild test \
            -project Demo/Demo.xcodeproj \
            -scheme DemoUITests \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=NO \
            | grep --line-buffered -E "(Test Suite|Test Case|passed|failed|error:|BUILD)"
