name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pick iOS Simulator
        run: |
          SIM_ID=$(xcrun simctl list -j devices available | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          for rt, devs in sorted(d.items(), reverse=True):
              if 'iOS' not in rt: continue
              for dev in devs:
                  if 'iPhone' in dev['name']:
                      print(dev['udid'])
                      raise SystemExit
          ")
          echo "SIM_ID=$SIM_ID" >> $GITHUB_ENV
          xcrun simctl boot "$SIM_ID" || true

      - name: Library Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme PurseSecureFields \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            | grep -E "(Test Suite|Test Case|✔|✘|error:|FAILED|PASSED|run with)"

      - name: Demo UI Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Demo/Demo.xcodeproj \
            -scheme DemoUITests \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            | grep -E "(Test Suite|Test Case|passed|failed|error:|BUILD)"
