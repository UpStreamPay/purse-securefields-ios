name: CI

on:
  pull_request:
  # The merged result is what release-please tags; test it, not only the PR head.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library-tests:
    name: Library Tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/ios-simulator

      - name: Run
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme PurseSecureFields \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -resultBundlePath "$RUNNER_TEMP/tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | grep --line-buffered -E "(Test Suite|Test Case|✔|✘|error:|FAILED|PASSED|run with)"

      # Test counts for purse-ci-harvester, which pulls them into BigQuery (format `ttr`). Read from
      # the result bundle: xcbeautify's JUnit report leaves out Swift Testing tests.
      - name: Write test telemetry
        if: ${{ !cancelled() }}
        run: |
          [ -d "$RUNNER_TEMP/tests.xcresult" ] || exit 0
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/tests.xcresult" \
            | jq -e 'select(.passedTests + .failedTests > 0)
                | {result_status: (if .failedTests > 0 then "failed" else "passed" end),
                   passed_count: .passedTests, failed_count: .failedTests}' \
            > ci-harvester-ttr.json || rm -f ci-harvester-ttr.json

      - name: Upload test telemetry
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-harvester-ttr-library
          path: ci-harvester-ttr.json
          retention-days: 7
          if-no-files-found: ignore

  demo-ui-tests:
    name: Demo UI Tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/ios-simulator

      # One retry per failing test, for the hosted simulator: its test runner sometimes hangs on the
      # first launch (kAXErrorIPCTimeout, "Failed to terminate"), and every later test then passes.
      # A real regression fails both attempts; a retried pass still shows as "failed" in the log.
      - name: Run
        run: |
          set -o pipefail
          xcodebuild test \
            -project Demo/Demo.xcodeproj \
            -scheme DemoUITests \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath "$RUNNER_TEMP/tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | grep --line-buffered -E "(Test Suite|Test Case|passed|failed|error:|BUILD)"

      # Same as Library Tests, under its own artifact name: two jobs of one run cannot share one.
      - name: Write test telemetry
        if: ${{ !cancelled() }}
        run: |
          [ -d "$RUNNER_TEMP/tests.xcresult" ] || exit 0
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/tests.xcresult" \
            | jq -e 'select(.passedTests + .failedTests > 0)
                | {result_status: (if .failedTests > 0 then "failed" else "passed" end),
                   passed_count: .passedTests, failed_count: .failedTests}' \
            > ci-harvester-ttr.json || rm -f ci-harvester-ttr.json

      - name: Upload test telemetry
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-harvester-ttr-ui
          path: ci-harvester-ttr.json
          retention-days: 7
          if-no-files-found: ignore

  release-build:
    name: Release build (macos-15)
    # What release.yml builds, on the toolchain it builds with (macos-15, an older Xcode on purpose),
    # unsigned. That compiler is not the one the jobs above use: Headless Checkout iOS v1.2.0 failed
    # to release on a Swift 6.1 concurrency error that Xcode 26 accepts, because nothing had built
    # with Xcode 16 before the release did.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build XCFramework
        run: ./scripts/build-xcframework.sh
