name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Library Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme PurseSecureFields \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO \
            | grep -E "(Test Suite|Test Case|✔|✘|error:|FAILED|PASSED|run with)"

      - name: Demo Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Demo/Demo.xcodeproj \
            -scheme DemoTests \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO \
            | grep -E "(Test Suite|Test Case|passed|failed|error:|BUILD)"
