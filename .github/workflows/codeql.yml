name: CodeQL

# Advanced setup, not GitHub's default one: default setup builds Swift with autobuild, which runs
# `swift build` on a macOS host, and this package is iOS-only, so that build fails. The Swift job
# builds the SDK scheme for the simulator instead. The repository must have code scanning enabled
# with default setup *off*: GitHub rejects advanced-setup uploads while default setup is on.
# See docs/contributing/ci.md.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write   # upload the results
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: ubuntu-latest
            build-mode: none
          - language: swift
            runner: macos-26
            build-mode: manual
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # The shipped SDK only: the Demo app is not distributed.
      - name: Build the SDK
        if: matrix.language == 'swift'
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme PurseSecureFields \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            | grep --line-buffered -E "(error:|BUILD)"

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
