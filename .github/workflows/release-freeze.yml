name: Release freeze

# While a release PR is open (NRT in progress), only fixes and reverts may reach main.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, closed, labeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  freeze:
    name: Release freeze
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: release-freeze-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # The title is untrusted: env only, never ${{ }} in the script.
      - name: Only fixes during a release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          releases=$(gh pr list --state open --label 'autorelease: pending' --json number -q '.[].number')
          if [[ -z "$releases" ]]; then
            echo "No release in progress"
            exit 0
          fi
          if grep -qx "$PR_NUMBER" <<<"$releases"; then
            echo "Release PR itself"
            exit 0
          fi
          # No `!`: a breaking fix would turn the release under NRT into a major.
          if [[ "$TITLE" =~ ^(fix|revert)(\([a-z0-9._/-]+\))?:\  ]]; then
            echo "Fix allowed during release #$(head -1 <<<"$releases")"
            exit 0
          fi
          echo "::error::Release #$(head -1 <<<"$releases") is open: only fix: or revert: PRs (not breaking) can be merged until it is released or closed. Got: $TITLE"
          exit 1

  # A release starting or ending changes every other PR's verdict: re-run their last check.
  # `labeled` rather than `opened`: release-please adds the label after creating the PR.
  recheck:
    name: Re-check open PRs
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'autorelease: pending')
      || ((github.event.action == 'reopened' || github.event.action == 'closed')
        && contains(github.event.pull_request.labels.*.name, 'autorelease: pending'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Re-run Release freeze on open PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          branches=$(gh pr list --state open --base main --limit 200 --json number,headRefName \
            -q '.[] | select(.number != ($ENV.PR_NUMBER | tonumber)) | .headRefName')
          failed=0
          for branch in $branches; do
            run=$(gh run list --workflow release-freeze.yml --event pull_request --branch "$branch" --limit 1 \
              --json databaseId,status -q '.[0] | "\(.databaseId) \(.status)"')
            read -r id status <<<"$run"
            if [[ -z "$id" || "$status" != completed ]]; then
              continue # no verdict yet, or one in progress that reads the live state
            fi
            if ! gh run rerun "$id"; then
              echo "::error::Could not re-run $id ($branch): push to it or re-run it by hand."
              failed=$((failed + 1))
            fi
          done
          if (( failed > 0 )); then
            exit 1
          fi
