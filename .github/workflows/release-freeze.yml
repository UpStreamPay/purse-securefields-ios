name: Release freeze

# While a release PR is open (NRT in progress), only fixes and reverts may reach main.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  freeze:
    name: Release freeze
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: release-freeze-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # The title is untrusted: env only, never ${{ }} in the script.
      - name: Only fixes during a release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$HEAD_REF" == release-please--* ]]; then
            echo "Release PR itself"
            exit 0
          fi
          release=$(gh pr list --state open --label 'autorelease: pending' --json url -q '.[0].url')
          if [[ -z "$release" ]]; then
            echo "No release in progress"
            exit 0
          fi
          if [[ "$TITLE" =~ ^(fix|revert)(\([a-z0-9._/-]+\))?!?:\  ]]; then
            echo "Fix allowed during $release"
            exit 0
          fi
          echo "::error::Release $release is open: only fix: or revert: PRs can be merged until it is released or closed. Got: $TITLE"
          exit 1

  # A release opening or closing changes every other PR's verdict: re-run their last check.
  recheck:
    name: Re-check open PRs
    if: >-
      startsWith(github.event.pull_request.head.ref, 'release-please--')
      && (github.event.action == 'opened' || github.event.action == 'closed')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Re-run Release freeze on open PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for branch in $(gh pr list --state open --base main --json headRefName -q '.[].headRefName | select(startswith("release-please--") | not)'); do
            run=$(gh run list --workflow release-freeze.yml --branch "$branch" --limit 1 --json databaseId -q '.[0].databaseId')
            if [[ -n "$run" ]]; then
              gh run rerun "$run" || echo "::warning::Could not re-run $run ($branch)"
            fi
          done
