name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.USP_GITHUB_ADMIN_ACCES_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
