name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  xcframework:
    name: Build & publish XCFramework
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          token: ${{ secrets.USP_GITHUB_ADMIN_ACCES_TOKEN }}

      - name: Import signing certificate
        env:
          P12_B64: ${{ secrets.APPLE_SIGNING_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.APPLE_SIGNING_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail

          # Decode the certificate. Passing the secret via env (not inline
          # interpolation) avoids the shell re-interpreting characters in the value.
          echo "$P12_B64" | base64 --decode > certificate.p12

          # Hard-fail only on the one thing that is unambiguously broken: an empty
          # file (missing secret or a base64 round-trip that produced nothing).
          if [ ! -s certificate.p12 ]; then
            echo "::error::Decoded certificate.p12 is empty — APPLE_SIGNING_CERT_P12_BASE64 is missing or did not decode."
            exit 1
          fi
          echo "Decoded certificate.p12 size: $(wc -c < certificate.p12) bytes"

          # Informational only — DO NOT gate the build on this. macOS `.p12` files
          # are typically encrypted with legacy ciphers (e.g. RC2-40-CBC) that
          # OpenSSL 3.x refuses unless the legacy provider is loaded (`-legacy`).
          # `security import` below handles those files natively, so an openssl
          # failure here is not a real problem — it's just a diagnostic hint.
          if openssl pkcs12 -legacy -in certificate.p12 -noout -passin pass:"$P12_PASS" 2>/dev/null \
             || openssl pkcs12 -in certificate.p12 -noout -passin pass:"$P12_PASS" 2>/dev/null; then
            echo "p12 opened by openssl — password verified."
          else
            echo "::warning::openssl could not open the .p12 (often just a legacy-cipher/OpenSSL-3 quirk). Deferring to 'security import', which handles legacy PKCS#12."
          fi

          security create-keychain -p "ci-temp" signing.keychain
          security default-keychain -s signing.keychain
          security unlock-keychain -p "ci-temp" signing.keychain
          if ! security import certificate.p12 \
                 -k signing.keychain \
                 -P "$P12_PASS" \
                 -T /usr/bin/codesign; then
            echo "::error::security import failed. With the empty-file case ruled out above, this means APPLE_SIGNING_CERT_P12_PASSWORD does not match this .p12, or the base64 in APPLE_SIGNING_CERT_P12_BASE64 was corrupted (wrapping/whitespace). Re-export the cert and regenerate the secret with: base64 -i cert.p12 | pbcopy"
            rm -f certificate.p12
            exit 1
          fi
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "ci-temp" \
            signing.keychain
          rm -f certificate.p12 openssl_err

      - name: Build XCFramework
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -o pipefail

          # Device archive — built UNSIGNED. A library XCFramework does not need a
          # signed slice; the whole .xcframework bundle is signed after creation
          # (below). Forcing a manual identity here also fails the SPM-generated
          # resource-bundle target (PurseSecureFields_PurseSecureFields), which has
          # no development team.
          xcodebuild archive \
            -scheme PurseSecureFields \
            -destination "generic/platform=iOS" \
            -archivePath .build/ios.xcarchive \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            CODE_SIGNING_ALLOWED=NO \
            INSTALL_PATH='/Library/Frameworks'

          # Simulator archive — also unsigned (Apple issues no simulator distribution certs).
          xcodebuild archive \
            -scheme PurseSecureFields \
            -destination "generic/platform=iOS Simulator" \
            -archivePath .build/ios-sim.xcarchive \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            CODE_SIGNING_ALLOWED=NO \
            INSTALL_PATH='/Library/Frameworks'

          # Create the (unsigned) XCFramework. Note: `xcodebuild -create-xcframework`
          # has no -codesign flag — the bundle is signed separately below.
          xcodebuild -create-xcframework \
            -framework .build/ios.xcarchive/Products/Library/Frameworks/PurseSecureFields.framework \
            -framework .build/ios-sim.xcarchive/Products/Library/Frameworks/PurseSecureFields.framework \
            -output .build/PurseSecureFields.xcframework

          # Sign the finished .xcframework bundle with the distribution identity so
          # consumers can verify it (Xcode 15+ third-party XCFramework signatures).
          # The identity is resolved from signing.keychain imported in the previous step.
          codesign --timestamp -v --sign "$SIGN_IDENTITY" .build/PurseSecureFields.xcframework

          cd .build
          zip -r PurseSecureFields.xcframework.zip PurseSecureFields.xcframework
          echo "CHECKSUM=$(swift package compute-checksum PurseSecureFields.xcframework.zip)" >> $GITHUB_ENV

      - name: Clean up keychain
        if: always()
        run: security delete-keychain signing.keychain || true

      - name: Update Package.swift to binary target
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          REPO="${{ github.repository }}"
          CHECKSUM="${{ env.CHECKSUM }}"
          URL="https://github.com/${REPO}/releases/download/${VERSION}/PurseSecureFields.xcframework.zip"
          cat > Package.swift << EOF
          // swift-tools-version: 5.9
          import PackageDescription

          let package = Package(
              name: "PurseSecureFields",
              platforms: [.iOS(.v15)],
              products: [
                  .library(name: "PurseSecureFields", targets: ["PurseSecureFields"])
              ],
              targets: [
                  .binaryTarget(
                      name: "PurseSecureFields",
                      url: "${URL}",
                      checksum: "${CHECKSUM}"
                  )
              ]
          )
          EOF

      - name: Commit & retag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "release: ${TAG} — binary target"
          git tag -f "${TAG}"
          git push origin "${TAG}" --force

      - name: Upload XCFramework to release
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            .build/PurseSecureFields.xcframework.zip \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.USP_GITHUB_ADMIN_ACCES_TOKEN }}
