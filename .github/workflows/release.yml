name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  xcframework:
    name: Build & publish XCFramework
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          token: ${{ secrets.USP_GITHUB_ADMIN_ACCES_TOKEN }}

      - name: Import signing certificate
        env:
          P12_B64: ${{ secrets.APPLE_SIGNING_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.APPLE_SIGNING_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail

          # Decode the certificate. Passing the secret via env (not inline
          # interpolation) avoids the shell re-interpreting characters in the value.
          echo "$P12_B64" | base64 --decode > certificate.p12

          # Fail fast with a clear diagnosis: a MAC verification failure at
          # `security import` is identical whether the .p12 bytes are corrupt
          # (bad base64 round-trip) or the password is wrong. Check both here.
          if [ ! -s certificate.p12 ]; then
            echo "::error::Decoded certificate.p12 is empty — APPLE_SIGNING_CERT_P12_BASE64 is missing or did not decode."
            exit 1
          fi
          echo "Decoded certificate.p12 size: $(wc -c < certificate.p12) bytes"
          if ! openssl pkcs12 -in certificate.p12 -noout -passin pass:"$P12_PASS" 2>openssl_err; then
            echo "::error::Could not open certificate.p12 with the provided password."
            echo "::error::Either APPLE_SIGNING_CERT_P12_PASSWORD is wrong, or the .p12 bytes are corrupt (re-check the base64 has no wrapping/whitespace)."
            cat openssl_err
            rm -f certificate.p12 openssl_err
            exit 1
          fi
          echo "p12 verified OK — password and file integrity both good."

          security create-keychain -p "ci-temp" signing.keychain
          security default-keychain -s signing.keychain
          security unlock-keychain -p "ci-temp" signing.keychain
          security import certificate.p12 \
            -k signing.keychain \
            -P "$P12_PASS" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "ci-temp" \
            signing.keychain
          rm -f certificate.p12 openssl_err

      - name: Build XCFramework
        run: |
          set -o pipefail

          # Device archive — signed with Apple Distribution certificate.
          # Distribution certs cannot sign simulator slices; signing is intentionally
          # deferred to the xcframework creation step which handles slice-level decisions.
          xcodebuild archive \
            -scheme PurseSecureFields \
            -destination "generic/platform=iOS" \
            -archivePath .build/ios.xcarchive \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            INSTALL_PATH='/Library/Frameworks'

          # Simulator archive — code signing disabled.
          # Apple does not issue distribution certificates for simulator binaries.
          xcodebuild archive \
            -scheme PurseSecureFields \
            -destination "generic/platform=iOS Simulator" \
            -archivePath .build/ios-sim.xcarchive \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            CODE_SIGNING_ALLOWED=NO \
            INSTALL_PATH='/Library/Frameworks'

          # Create and sign the XCFramework.
          # -codesign signs the device slice with the distribution certificate.
          # Requires Xcode 14+ (available on macos-15 runners).
          xcodebuild -create-xcframework \
            -framework .build/ios.xcarchive/Products/Library/Frameworks/PurseSecureFields.framework \
            -framework .build/ios-sim.xcarchive/Products/Library/Frameworks/PurseSecureFields.framework \
            -output .build/PurseSecureFields.xcframework \
            -codesign "${{ secrets.APPLE_SIGNING_IDENTITY }}"

          cd .build
          zip -r PurseSecureFields.xcframework.zip PurseSecureFields.xcframework
          echo "CHECKSUM=$(swift package compute-checksum PurseSecureFields.xcframework.zip)" >> $GITHUB_ENV

      - name: Clean up keychain
        if: always()
        run: security delete-keychain signing.keychain || true

      - name: Update Package.swift to binary target
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          REPO="${{ github.repository }}"
          CHECKSUM="${{ env.CHECKSUM }}"
          URL="https://github.com/${REPO}/releases/download/${VERSION}/PurseSecureFields.xcframework.zip"
          cat > Package.swift << EOF
          // swift-tools-version: 5.9
          import PackageDescription

          let package = Package(
              name: "PurseSecureFields",
              platforms: [.iOS(.v15)],
              products: [
                  .library(name: "PurseSecureFields", targets: ["PurseSecureFields"])
              ],
              targets: [
                  .binaryTarget(
                      name: "PurseSecureFields",
                      url: "${URL}",
                      checksum: "${CHECKSUM}"
                  )
              ]
          )
          EOF

      - name: Commit & retag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "release: ${TAG} — binary target"
          git tag -f "${TAG}"
          git push origin "${TAG}" --force

      - name: Upload XCFramework to release
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            .build/PurseSecureFields.xcframework.zip \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.USP_GITHUB_ADMIN_ACCES_TOKEN }}
