name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  xcframework:
    name: Build & publish XCFramework
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build XCFramework
        run: |
          set -o pipefail

          xcodebuild archive \
            -scheme PurseSecureFields \
            -destination "generic/platform=iOS" \
            -archivePath .build/ios.xcarchive \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            CODE_SIGNING_ALLOWED=NO

          xcodebuild archive \
            -scheme PurseSecureFields \
            -destination "generic/platform=iOS Simulator" \
            -archivePath .build/ios-sim.xcarchive \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            CODE_SIGNING_ALLOWED=NO

          xcodebuild -create-xcframework \
            -framework .build/ios.xcarchive/Products/Library/Frameworks/PurseSecureFields.framework \
            -framework .build/ios-sim.xcarchive/Products/Library/Frameworks/PurseSecureFields.framework \
            -output .build/PurseSecureFields.xcframework

          cd .build
          zip -r PurseSecureFields.xcframework.zip PurseSecureFields.xcframework
          echo "CHECKSUM=$(swift package compute-checksum PurseSecureFields.xcframework.zip)" >> $GITHUB_ENV

      - name: Update Package.swift to binary target
        run: |
          python3 - <<'PYEOF'
import os
version  = os.environ['VERSION']
url      = f"https://github.com/{os.environ['REPO']}/releases/download/{version}/PurseSecureFields.xcframework.zip"
checksum = os.environ['CHECKSUM']
content  = f"""// swift-tools-version: 5.9
import PackageDescription

let package = Package(
    name: "PurseSecureFields",
    platforms: [.iOS(.v15)],
    products: [
        .library(name: "PurseSecureFields", targets: ["PurseSecureFields"])
    ],
    targets: [
        .binaryTarget(
            name: "PurseSecureFields",
            url: "{url}",
            checksum: "{checksum}"
        )
    ]
)
"""
with open('Package.swift', 'w') as f:
    f.write(content)
PYEOF
        env:
          VERSION:  ${{ github.event.release.tag_name }}
          REPO:     ${{ github.repository }}
          CHECKSUM: ${{ env.CHECKSUM }}

      - name: Commit & retag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "release: ${TAG} — binary target"
          git tag -f "${TAG}"
          git push origin "${TAG}" --force

      - name: Upload XCFramework to release
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            .build/PurseSecureFields.xcframework.zip \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
