name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  xcframework:
    name: Build & publish XCFramework
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          token: ${{ secrets.USP_GITHUB_ADMIN_ACCES_TOKEN }}

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_SIGNING_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_SIGNING_CERT_P12_PASSWORD }}

      - name: Build XCFramework
        run: |
          set -o pipefail

          # Device archive — built UNSIGNED. A library XCFramework does not need a
          # signed slice; the whole .xcframework bundle is signed after creation
          # (below). Forcing a manual identity here also fails the SPM-generated
          # resource-bundle target (PurseSecureFields_PurseSecureFields), which has
          # no development team.
          xcodebuild archive \
            -scheme PurseSecureFields \
            -destination "generic/platform=iOS" \
            -archivePath .build/ios.xcarchive \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            CODE_SIGNING_ALLOWED=NO \
            INSTALL_PATH='/Library/Frameworks'

          # Simulator archive — also unsigned (Apple issues no simulator distribution certs).
          xcodebuild archive \
            -scheme PurseSecureFields \
            -destination "generic/platform=iOS Simulator" \
            -archivePath .build/ios-sim.xcarchive \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            CODE_SIGNING_ALLOWED=NO \
            INSTALL_PATH='/Library/Frameworks'

          # Create the (unsigned) XCFramework. Note: `xcodebuild -create-xcframework`
          # has no -codesign flag — the bundle is signed separately below.
          xcodebuild -create-xcframework \
            -framework .build/ios.xcarchive/Products/Library/Frameworks/PurseSecureFields.framework \
            -framework .build/ios-sim.xcarchive/Products/Library/Frameworks/PurseSecureFields.framework \
            -output .build/PurseSecureFields.xcframework

          # Sign the finished .xcframework bundle so consumers can verify it
          # (Xcode 15+ third-party XCFramework signatures). Prefer a fully-valid
          # identity; fall back to any identity with a private key, since `-v`
          # rejects an untrusted chain (e.g. missing Apple WWDR intermediate) or
          # expiry even though codesign can still sign with it.
          IDENTITY=$(security find-identity -v -p codesigning | awk '/^[[:space:]]*[0-9]+\)/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            IDENTITY=$(security find-identity -p codesigning | awk '/^[[:space:]]*[0-9]+\)/ {print $2; exit}')
            [ -n "$IDENTITY" ] && echo "::warning::No *valid* identity (untrusted chain or expired?). Falling back to identity $IDENTITY, which has a private key."
          fi
          if [ -z "$IDENTITY" ]; then
            echo "::error::No codesigning identity with a private key found. The .p12 likely contains only the certificate, not the private key — re-export it from Keychain Access selecting BOTH the certificate and its private key, then regenerate APPLE_SIGNING_CERT_P12_BASE64."
            exit 1
          fi
          echo "Signing xcframework with identity $IDENTITY"
          codesign --timestamp -v --sign "$IDENTITY" .build/PurseSecureFields.xcframework

          cd .build
          zip -r PurseSecureFields.xcframework.zip PurseSecureFields.xcframework
          echo "CHECKSUM=$(swift package compute-checksum PurseSecureFields.xcframework.zip)" >> $GITHUB_ENV

      - name: Update Package.swift to binary target
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          REPO="${{ github.repository }}"
          CHECKSUM="${{ env.CHECKSUM }}"
          URL="https://github.com/${REPO}/releases/download/${VERSION}/PurseSecureFields.xcframework.zip"
          cat > Package.swift << EOF
          // swift-tools-version: 5.9
          import PackageDescription

          let package = Package(
              name: "PurseSecureFields",
              platforms: [.iOS(.v15)],
              products: [
                  .library(name: "PurseSecureFields", targets: ["PurseSecureFields"])
              ],
              targets: [
                  .binaryTarget(
                      name: "PurseSecureFields",
                      url: "${URL}",
                      checksum: "${CHECKSUM}"
                  )
              ]
          )
          EOF

      - name: Commit & retag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "release: ${TAG} — binary target"
          git tag -f "${TAG}"
          git push origin "${TAG}" --force

      - name: Upload XCFramework to release
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            .build/PurseSecureFields.xcframework.zip \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.USP_GITHUB_ADMIN_ACCES_TOKEN }}
