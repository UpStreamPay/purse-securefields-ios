name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

# Read by every step through the environment, never interpolated into a script: a tag name
# is text anyone with write access chooses.
env:
  TAG: ${{ github.event.release.tag_name }}

jobs:
  xcframework:
    name: Build & publish XCFramework
    # Older than CI's macos-26 on purpose: the .swiftinterface is written by this Xcode, and
    # an older one keeps the binary importable by merchants who have not upgraded yet.
    runs-on: macos-15
    timeout-minutes: 45
    # Every release waits for a codeowner: the `release` environment requires a review from
    # @UpStreamPay/pci-dss and holds the signing secrets and the release token.
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      # Only code that went through a reviewed PR ships.
      - name: Refuse a tag that is not on main
        run: |
          git merge-base --is-ancestor "$TAG" origin/main \
            || { echo "::error::$TAG is not on main — only reviewed code is released."; exit 1; }

      # A missing secret otherwise surfaces deep inside the certificate import ("At least one of
      # p12-filepath or p12-file-base64 must be provided") or at the retag. Say what is missing instead.
      - name: Check the release secrets
        env:
          P12: ${{ secrets.APPLE_SIGNING_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_P12_PASSWORD }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          missing=""
          [ -n "$RELEASE_TOKEN" ] || missing="$missing RELEASE_PLEASE_TOKEN"
          [ -n "$P12" ] || missing="$missing APPLE_SIGNING_CERT_P12_BASE64"
          [ -n "$P12_PASSWORD" ] || missing="$missing APPLE_SIGNING_CERT_P12_PASSWORD"
          [ -z "$missing" ] || { echo "::error::Missing secrets:$missing — see docs/contributing/release.md."; exit 1; }

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.APPLE_SIGNING_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_SIGNING_CERT_P12_PASSWORD }}

      # Archives, repackages and checks the XCFramework (unsigned). The same script runs in CI's
      # "Release build (macos-15)" job, so a release only builds what CI already built.
      - name: Build XCFramework
        run: ./scripts/build-xcframework.sh

      - name: Sign, zip, checksum
        run: |
          set -o pipefail
          # Sign the finished .xcframework bundle so consumers can verify it
          # (Xcode 15+ third-party XCFramework signatures). A *valid* identity only: an
          # expired or untrusted one would still sign, and ship a signature no consumer can
          # trust.
          IDENTITY=$(security find-identity -v -p codesigning | awk '/^[[:space:]]*[0-9]+\)/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No valid codesigning identity. Either the certificate is expired or its chain is untrusted, or the .p12 holds only the certificate without its private key — re-export BOTH from Keychain Access, then regenerate APPLE_SIGNING_CERT_P12_BASE64."
            exit 1
          fi
          echo "Signing xcframework with identity $IDENTITY"
          codesign --timestamp -v --sign "$IDENTITY" .build/PurseSecureFields.xcframework

          cd .build
          zip -r PurseSecureFields.xcframework.zip PurseSecureFields.xcframework
          echo "CHECKSUM=$(swift package compute-checksum PurseSecureFields.xcframework.zip)" >> "$GITHUB_ENV"

      - name: Update Package.swift to binary target
        run: |
          VERSION="$TAG"
          REPO="$GITHUB_REPOSITORY"
          URL="https://github.com/${REPO}/releases/download/${VERSION}/PurseSecureFields.xcframework.zip"
          cat > Package.swift << EOF
          // swift-tools-version: 5.9
          import PackageDescription

          let package = Package(
              name: "PurseSecureFields",
              platforms: [.iOS(.v15)],
              products: [
                  .library(name: "PurseSecureFields", targets: ["PurseSecureFields"])
              ],
              targets: [
                  .binaryTarget(
                      name: "PurseSecureFields",
                      url: "${URL}",
                      checksum: "${CHECKSUM}"
                  )
              ]
          )
          EOF

      # The `release tags` ruleset lets only repository admins create or move a v* tag, so the push
      # goes out as RELEASE_PLEASE_TOKEN (an admin's token, readable only inside this approved job)
      # and not as GITHUB_TOKEN: bypassing the GitHub Actions app instead would let any workflow on
      # any branch move a tag. The token is used for this one command only, never handed to
      # checkout, so it is not in .git/config while package code builds.
      - name: Commit & retag
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "release: ${TAG} — binary target"
          git tag -f "${TAG}"
          # The empty extraheader drops checkout's GITHUB_TOKEN header, so the URL's token is used.
          git -c http.https://github.com/.extraheader= \
            push "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/${TAG}" --force

      - name: Upload XCFramework to release
        run: |
          gh release upload "$TAG" \
            .build/PurseSecureFields.xcframework.zip \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
