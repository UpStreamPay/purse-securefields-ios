name: Snapshot

# Builds the open release PR as an unsigned XCFramework and force-pushes a `snapshot` branch whose
# Package.swift points at it, so the next release can be tested before it is merged. No approval:
# nothing here is a release. See docs/contributing/release.md#snapshots.

on:
  push:
    branches: [release-please--branches--main--components--sdk]

permissions:
  contents: write   # the snapshot release and branch

concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    # Same Xcode as release.yml, so the snapshot's .swiftinterface matches what a release ships.
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # No token in .git/config while the build runs; the push passes it explicitly.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `snapshot-…`, not `sdk-v…`: release-please must not read it as a release, and the tag
      # ruleset does not cover it.
      - name: Set SDK version
        run: |
          VERSION="$(jq -r '."."' .release-please-manifest.json)-SNAPSHOT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SNAPSHOT_TAG=snapshot-$VERSION-$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build XCFramework
        run: ./scripts/build-xcframework.sh

      - name: Zip, checksum
        run: |
          cd .build
          zip -qr PurseSecureFields.xcframework.zip PurseSecureFields.xcframework
          echo "CHECKSUM=$(swift package compute-checksum PurseSecureFields.xcframework.zip)" >> "$GITHUB_ENV"

      # A new release per run: SPM caches a binary by URL, so reusing one URL with new contents
      # would fail the checksum.
      - name: Publish the snapshot release
        run: |
          gh release create "$SNAPSHOT_TAG" .build/PurseSecureFields.xcframework.zip \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "$VERSION (#$GITHUB_RUN_NUMBER)" \
            --notes "Unsigned snapshot of the open release PR. Not a release. Use \`.package(url: …, branch: \"snapshot\")\`."

      # Same manifest as release.yml writes.
      - name: Push the snapshot branch
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${SNAPSHOT_TAG}/PurseSecureFields.xcframework.zip"
          cat > Package.swift << EOF
          // swift-tools-version: 5.9
          import PackageDescription

          let package = Package(
              name: "PurseSecureFields",
              platforms: [.iOS(.v15)],
              products: [
                  .library(name: "PurseSecureFields", targets: ["PurseSecureFields"])
              ],
              targets: [
                  .binaryTarget(
                      name: "PurseSecureFields",
                      url: "${URL}",
                      checksum: "${CHECKSUM}"
                  )
              ]
          )
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "snapshot: $VERSION — binary target"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" \
            push --force "https://github.com/$GITHUB_REPOSITORY.git" HEAD:refs/heads/snapshot

      - name: Delete older snapshot releases
        run: |
          old=$(gh release list --limit 100 --json tagName -q '.[].tagName' \
            | grep '^snapshot-' | grep -vx "$SNAPSHOT_TAG" || true)
          for tag in $old; do gh release delete "$tag" --cleanup-tag --yes; done
